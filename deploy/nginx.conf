# Nginx 反向代理配置（云部署示例）
# 使用方式：
#   1. 将本文件复制到 /etc/nginx/conf.d/progress-plan.conf
#   2. 替换 server_name 为你的域名
#   3. 如需 HTTPS，请在对应 server 块中配置 ssl_certificate 与 ssl_certificate_key
#   4. 后端启动：uvicorn backend.main:app --host 127.0.0.1 --port 8000

upstream progress_plan_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name example.com;  # 修改为你的域名

    # 日志
    access_log /var/log/nginx/progress-plan.access.log;
    error_log /var/log/nginx/progress-plan.error.log;

    # 前端静态资源与 API 统一代理
    location / {
        proxy_pass http://progress_plan_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 静态文件可额外配置缓存（可选）
    location /static/ {
        proxy_pass http://progress_plan_api/static/;
        proxy_set_header Host $host;
        proxy_buffering off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

