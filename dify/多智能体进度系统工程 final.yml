          \                        boundaries[\"trade_peak\"][name] = int(item.get(\"\
          quantity\", 0))\n                    except (ValueError, TypeError):\n \
          \                       pass\n\n    return boundaries\n\n\ndef apply_peak_shaving(demand:\
          \ Dict, boundaries: Dict) -> Dict:\n    if not boundaries:\n        return\
