    - data:
        code: "\"\"\"\n节点名称：关键路径计算 CPM（兼容 WBS phases 结构 + 二级依赖映射）\n输入变量：\n  - wbs（Object）：WBS\
          \ 对象，支持 phases[].work_packages[].sub_packages[] 结构\n  - dependencies（Object）：依赖关系列表，支持二级\
          \ ID（如 1.1）作为 predecessor/successor\n输出变量：\n  - cpm_result（Object）：包含 total_duration_days,\
          \ critical_path, schedule\n\"\"\"\n\nimport json\nfrom typing import List,\
          \ Dict, Any, Optional\n\n\ndef flatten_wbs_phases(wbs_input: Dict) -> Dict[str,\
          \ Dict]:\n    \"\"\"\n    从 WBS 的 phases 结构中提取所有叶子任务（sub_packages）。\n  \
          \  返回: { task_id: { \"name\": ..., \"duration\": ... } }\n    同时建立 二级ID\
          \ -> 第一个叶子ID 的映射，用于依赖匹配。\n    \"\"\"\n    task_info = {}\n    id_mapping\
          \ = {}  # 二级ID -> 第一个叶子ID\n\n    phases = wbs_input.get(\"phases\", [])\n\
          \    if not isinstance(phases, list):\n        phases = []\n\n    for phase\
          \ in phases:\n        work_packages = phase.get(\"work_packages\", [])\n\
          \        if not isinstance(work_packages, list):\n            continue\n\
          \        for wp in work_packages:\n            sub_packages = wp.get(\"\
          sub_packages\", [])\n            if not isinstance(sub_packages, list):\n\
          \                continue\n            # 如果父 ID 还没有映射到子 ID，记录第一个\n     \
          \       parent_id = wp.get(\"id\", \"\")\n            if parent_id and parent_id\
          \ not in id_mapping and sub_packages:\n                first_child = sub_packages[0]\n\
          \                id_mapping[parent_id] = first_child.get(\"id\", parent_id)\n\
          \n            for sub in sub_packages:\n                task_id = sub.get(\"\
          id\")\n                if not task_id:\n                    continue\n \
          \               duration = sub.get(\"duration_days\") or sub.get(\"planned_duration_days\"\
          ) or 1\n                try:\n                    duration = int(duration)\n\
          \                except (TypeError, ValueError):\n                    duration\
          \ = 1\n                task_info[task_id] = {\n                    \"name\"\
          : sub.get(\"name\") or task_id,\n                    \"duration\": duration,\n\
          \                    \"es\": 0,\n                    \"ef\": 0,\n      \
          \              \"ls\": 0,\n                    \"lf\": 0\n             \
          \   }\n\n    return task_info, id_mapping\n\n\ndef parse_dependencies_with_mapping(deps_input:\
          \ Dict, id_mapping: Dict) -> tuple:\n    \"\"\"\n    解析依赖关系，支持二级ID映射到叶子ID。\n\
          \    如果 predecessor 或 successor 是二级ID，则尝试映射到第一个叶子ID。\n    \"\"\"\n    deps_list\
          \ = deps_input.get(\"dependencies\", [])\n    if not isinstance(deps_list,\
          \ list):\n        deps_list = []\n\n    predecessors = {}\n    successors\
          \ = {}\n\n    for dep in deps_list:\n        pred = dep.get(\"predecessor\"\
          )\n        succ = dep.get(\"successor\")\n        if not pred or not succ:\n\
          \            continue\n\n        # 尝试映射二级ID -> 叶子ID\n        pred = id_mapping.get(pred,\
          \ pred)\n        succ = id_mapping.get(succ, succ)\n\n        # 如果映射后仍为空，跳过\n\
          \        if not pred or not succ:\n            continue\n\n        lag =\
          \ dep.get(\"lag_days\", 0)\n        dep_type = dep.get(\"type\", \"FS\"\
          )\n\n        # 目前只支持 FS 和 SS，其他类型按 FS 处理\n        if dep_type not in [\"\
          FS\", \"SS\"]:\n            dep_type = \"FS\"\n\n        predecessors.setdefault(succ,\
          \ []).append({\"task_id\": pred, \"lag\": lag, \"type\": dep_type})\n  \
          \      successors.setdefault(pred, []).append({\"task_id\": succ, \"lag\"\
          : lag, \"type\": dep_type})\n\n    return predecessors, successors\n\n\n\
          def topological_sort(task_ids: List[str], predecessors: Dict, successors:\
          \ Dict) -> List[str]:\n    \"\"\"拓扑排序\"\"\"\n    in_degree = {tid: len(predecessors.get(tid,\
          \ [])) for tid in task_ids}\n    queue = [tid for tid, deg in in_degree.items()\
          \ if deg == 0]\n    sorted_list = []\n    while queue:\n        queue.sort()\n\
          \        current = queue.pop(0)\n        sorted_list.append(current)\n \
          \       for succ_info in successors.get(current, []):\n            succ\
          \ = succ_info[\"task_id\"]\n            if succ in in_degree:\n        \
          \        in_degree[succ] -= 1\n                if in_degree[succ] == 0:\n\
          \                    queue.append(succ)\n    return sorted_list\n\n\ndef\
          \ calculate_cpm(wbs: Dict, dependencies: Dict) -> Dict[str, Any]:\n    \"\
          \"\"关键路径计算主函数\"\"\"\n    # 1. 提取任务信息，同时建立二级ID映射\n    task_info, id_mapping\
          \ = flatten_wbs_phases(wbs)\n\n    if not task_info:\n        return {\"\
          total_duration_days\": 0, \"critical_path\": [], \"schedule\": []}\n\n \
          \   # 2. 解析依赖关系（含映射）\n    predecessors, successors = parse_dependencies_with_mapping(dependencies,\
          \ id_mapping)\n\n    # 3. 确保所有任务都有前驱后继字典\n    for tid in task_info:\n  \
          \      predecessors.setdefault(tid, [])\n        successors.setdefault(tid,\
          \ [])\n\n    # 4. 拓扑排序\n    sorted_tasks = topological_sort(list(task_info.keys()),\
          \ predecessors, successors)\n\n    # 5. 正向计算 ES / EF\n    for tid in sorted_tasks:\n\
          \        es = 0\n        for pred_info in predecessors.get(tid, []):\n \
          \           pred_id = pred_info[\"task_id\"]\n            lag = pred_info[\"\
          lag\"]\n            dep_type = pred_info.get(\"type\", \"FS\")\n       \
          \     if pred_id in task_info:\n                if dep_type == \"FS\":\n\
          \                    es = max(es, task_info[pred_id][\"ef\"] + lag)\n  \
          \              elif dep_type == \"SS\":\n                    es = max(es,\
          \ task_info[pred_id][\"es\"] + lag)\n        task_info[tid][\"es\"] = es\n\
          \        task_info[tid][\"ef\"] = es + task_info[tid][\"duration\"]\n\n\
          \    total_duration = max(info[\"ef\"] for info in task_info.values()) if\
          \ task_info else 0\n\n    # 6. 反向计算 LS / LF\n    for tid in reversed(sorted_tasks):\n\
          \        lf = total_duration\n        has_successor = False\n        for\
          \ succ_info in successors.get(tid, []):\n            succ_id = succ_info[\"\
          task_id\"]\n            lag = succ_info[\"lag\"]\n            dep_type =\
          \ succ_info.get(\"type\", \"FS\")\n            if succ_id in task_info:\n\
          \                if dep_type == \"FS\":\n                    lf = min(lf,\
          \ task_info[succ_id][\"ls\"] - lag)\n                elif dep_type == \"\
          SS\":\n                    lf = min(lf, task_info[succ_id][\"es\"] + task_info[succ_id][\"\
          duration\"] - lag)\n                has_successor = True\n        if not\
          \ has_successor:\n            lf = total_duration\n        task_info[tid][\"\
          ls\"] = lf - task_info[tid][\"duration\"]\n        task_info[tid][\"lf\"\
          ] = lf\n\n    # 7. 识别关键路径（总时差为0的任务）\n    critical_tasks = [tid for tid in\
          \ sorted_tasks if abs(task_info[tid][\"ls\"] - task_info[tid][\"es\"]) <\
          \ 1e-9]\n\n    # 8. 对关键路径排序\n    def sort_critical_path(path):\n       \
          \ if not path:\n            return path\n        sorted_path = []\n    \
          \    remaining = set(path)\n        while remaining:\n            for tid\
          \ in list(remaining):\n                preds = [p[\"task_id\"] for p in\
          \ predecessors.get(tid, [])]\n                if all(p not in remaining\
          \ for p in preds):\n                    sorted_path.append(tid)\n      \
          \              remaining.remove(tid)\n                    break\n      \
          \  return sorted_path\n\n    critical_path = sort_critical_path(critical_tasks)\n\
          \n    # 9. 构建 schedule\n    schedule = []\n    for tid in sorted_tasks:\n\
          \        schedule.append({\n            \"task_id\": tid,\n            \"\
          es\": task_info[tid][\"es\"],\n            \"ef\": task_info[tid][\"ef\"\
          ],\n            \"ls\": task_info[tid][\"ls\"],\n            \"lf\": task_info[tid][\"\
          lf\"]\n        })\n\n    return {\n        \"total_duration_days\": total_duration,\n\
          \        \"critical_path\": critical_path,\n        \"schedule\": schedule\n\
          \    }\n\n\ndef main(wbs: dict, dependencies: dict) -> dict:\n    \"\"\"\
          Dify Python 节点入口函数\"\"\"\n    try:\n        result = calculate_cpm(wbs,\
          \ dependencies)\n        return {\"cpm_result\": result}\n    except Exception\
          \ as e:\n        return {\"cpm_result\": {\"error\": str(e), \"total_duration_days\"\
          : 0, \"critical_path\": [], \"schedule\": []}}"
        code_language: python3
