    - data:
        code: "\"\"\"输出整理：final_text 只输出中文。plan 解析仅用于内部判断（决定用完整中文还是兜底摘要）。\"\"\"\n\n\
          import json\n\n\ndef main(upstream_text: str = \"\", upstream_structured=None)\
          \ -> dict:\n    text = (upstream_text or \"\").strip()\n    structured =\
          \ upstream_structured or {}\n\n    # conversation.plan 是 JSON 字符串，解析成 dict（仅供内部判断用）\n\
          \    if isinstance(structured, str):\n        raw = structured.strip()\n\
          \        try:\n            structured = json.loads(raw)\n        except\
          \ Exception:\n            extracted = _try_extract_plan(raw)\n         \
          \   structured = extracted or {}\n\n    if not isinstance(structured, dict):\n\
          \        structured = {}\n\n    # 兜底：把模型漏进文字里的 JSON 剥掉，保证对话框只显示中文\n    text\
          \ = _strip_all_json(text)\n\n    if not text and _has_plan(structured):\n\
          \        text = _build_summary(structured)\n\n    if not text:\n       \
          \ text = \"进度方案已生成\"\n\n    return {\"final_text\": text}\n\n\ndef _has_plan(d:\
          \ dict) -> bool:\n    if not isinstance(d, dict):\n        return False\n\
          \    if isinstance(d.get(\"structured_output\"), dict):\n        s = d[\"\
          structured_output\"]\n        return \"overview\" in s and \"all_tasks_schedule\"\
          \ in s\n    return \"overview\" in d and \"all_tasks_schedule\" in d\n\n\
          \ndef _build_summary(structured: dict) -> str:\n    inner = structured.get(\"\
          structured_output\", structured)\n    overview = inner.get(\"overview\"\
          , {})\n    name = overview.get(\"project_name\", \"该项目\")\n    days = overview.get(\"\
          total_duration_days\", \"?\")\n    start = overview.get(\"planned_start_date\"\
          , \"?\")\n    end = overview.get(\"planned_end_date\", \"?\")\n    tasks\
          \ = inner.get(\"all_tasks_schedule\", [])\n    critical = overview.get(\"\
          critical_path_length\", len(inner.get(\"critical_path_tasks\", [])))\n \
          \   milestones = inner.get(\"key_milestones\", [])\n    summary = (\n  \
          \      f\"✅ 已为您生成《{name}》的施工进度计划：\\n\"\n        f\"• 总工期：{days} 天（{start}\
          \ → {end}）\\n\"\n        f\"• 工序总数：{len(tasks)} 道，其中关键路径 {critical} 道\\\
          n\"\n    )\n    if milestones:\n        summary += \"• 关键里程碑：\\n\"\n   \
          \     for m in milestones[:5]:\n            summary += f\"   - {m.get('name',\
          \ '')}（{m.get('date', '')}）\\n\"\n    summary += \"\\n\U0001F4CA 网页下方已自动渲染甘特图、资源曲线等图表，您可以直接查看。\"\
          \n    return summary\n\n\ndef _strip_all_json(s: str) -> str:\n    import\
          \ re\n\n    if not s:\n        return s\n\n    # 1) 删除各种 ```json ... ```\
          \ 代码块\n    s = re.sub(r\"```(?:json|JSON|structured_output)?\\s*\\{[\\s\\\
          S]*?\\}\\s*```\", \"\", s, flags=re.IGNORECASE)\n    s = re.sub(r\"```[\\\
          w\\s-]*\\s*[\\s\\S]*?\\s*```\", \"\", s, flags=re.IGNORECASE)\n    s = re.sub(r\"\
          ```(?:json)?\\s*[\\s\\S]*$\", \"\", s, flags=re.IGNORECASE)\n\n    # 2)\
          \ 全文扫描删除大型 JSON 对象\n    out = []\n    i = 0\n    n = len(s)\n    while i\
          \ < n:\n        c = s[i]\n        if c != \"{\":\n            out.append(c)\n\
          \            i += 1\n            continue\n        depth = 0\n        end\
          \ = -1\n        in_str = False\n        esc = False\n        for j in range(i,\
          \ n):\n            ch = s[j]\n            if esc:\n                esc =\
          \ False\n                continue\n            if ch == \"\\\\\":\n    \
          \            esc = True\n                continue\n            if ch ==\
          \ '\"':\n                in_str = not in_str\n                continue\n\
          \            if in_str:\n                continue\n            if ch ==\
          \ \"{\":\n                depth += 1\n            elif ch == \"}\":\n  \
          \              depth -= 1\n                if depth == 0:\n            \
          \        end = j\n                    break\n        if end != -1:\n   \
          \         candidate = s[i:end + 1]\n            if len(candidate) > 200\
          \ and _looks_like_plan_json(candidate):\n                i = end + 1\n \
          \               while i < n and s[i] in \" \\t\\r\\n,，;；\":\n          \
          \          i += 1\n                while out and out[-1] in \" \\t\\r\\\
          n\":\n                    out.pop()\n                if out:\n         \
          \           out.append(\"\\n\")\n                continue\n        out.append(c)\n\
          \        i += 1\n\n    # 3) 兜底清理 structured_output 包裹碎片\n    s = \"\".join(out)\n\
          \    s = re.sub(r'\"structured_output\"\\s*:\\s*\\{[\\s\\S]*\\}\\s*', \"\
          \", s, flags=re.DOTALL)\n    return s.strip()\n\n\ndef _looks_like_plan_json(text:\
          \ str) -> bool:\n    keywords = (\n        \"overview\", \"all_tasks_schedule\"\
          , \"structured_output\", \"project_name\",\n        \"planned_start_date\"\
          , \"planned_end_date\", \"critical_path_tasks\",\n        \"key_milestones\"\
          , \"resource_plan\", \"assigned_resources\",\n    )\n    return sum(1 for\
          \ kw in keywords if kw in text) >= 2\n\n\ndef _try_extract_plan(text: str)\
          \ -> dict:\n    import re\n\n    if not text:\n        return None\n   \
          \ m = re.search(r\"```(?:json)?\\s*(\\{.*?\\})\\s*```\", text, re.DOTALL\
          \ | re.IGNORECASE)\n    if m:\n        try:\n            d = json.loads(m.group(1))\n\
          \            if _has_plan(d):\n                return d\n        except\
          \ Exception:\n            pass\n    start = text.find(\"{\")\n    while\
          \ start != -1:\n        depth = 0\n        end = -1\n        in_str = False\n\
          \        esc = False\n        for i in range(start, len(text)):\n      \
          \      c = text[i]\n            if esc:\n                esc = False\n \
          \               continue\n            if c == \"\\\\\":\n              \
          \  esc = True\n                continue\n            if c == '\"':\n   \
          \             in_str = not in_str\n                continue\n          \
          \  if in_str:\n                continue\n            if c == \"{\":\n  \
          \              depth += 1\n            elif c == \"}\":\n              \
          \  depth -= 1\n                if depth == 0:\n                    end =\
          \ i\n                    break\n        if end != -1:\n            try:\n\
          \                d = json.loads(text[start:end + 1])\n                if\
          \ _has_plan(d):\n                    return d\n            except Exception:\n\
          \                pass\n            start = text.find(\"{\", end + 1)\n \
          \       else:\n            break\n    return None"
