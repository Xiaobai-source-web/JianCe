    - data:
        code: "\"\"\"\n节点名称：边界条件与依赖关系合并器\n输入变量：\n  - boundary_conditions（Object 或\
          \ String）：边界条件数据（设备峰值、工种峰值等）\n  - dependencies（Object 或 String）：依赖关系数据（dependencies\
          \ 数组）\n输出变量：\n  - combined_string（String）：合并后的 JSON 字符串\n\"\"\"\n\nimport\
          \ json\n\ndef main(boundary_conditions: dict, dependencies: dict) -> dict:\n\
          \    # 如果输入是字符串，尝试解析为 JSON\n    if isinstance(boundary_conditions, str):\n\
          \        try:\n            boundary_conditions = json.loads(boundary_conditions)\n\
          \        except json.JSONDecodeError:\n            # 如果解析失败，保持原字符串（但后续可能出错）\n\
          \            pass\n\n    if isinstance(dependencies, str):\n        try:\n\
          \            dependencies = json.loads(dependencies)\n        except json.JSONDecodeError:\n\
          \            pass\n\n    # 确保是字典类型\n    if not isinstance(boundary_conditions,\
          \ dict):\n        boundary_conditions = {\"raw\": boundary_conditions}\n\
          \    if not isinstance(dependencies, dict):\n        dependencies = {\"\
          raw\": dependencies}\n\n    # 合并\n    combined = {\n        \"boundary_conditions\"\
          : boundary_conditions,\n        \"dependencies\": dependencies\n    }\n\n\
          \    # 转为 JSON 字符串\n    combined_string = json.dumps(combined, ensure_ascii=False,\
          \ indent=2)\n\n    return {\"combined_string\": combined_string}"
