          provider: langgenius/tongyi/tongyi
        prompt_template:
        - id: bd53dc0c-d506-42a2-bc6b-5034b2dd9614
          role: system
          text: "{{#1781057854868.text#}}\n{{#sys.query#}}\n以上是你能用到的信息\n你是一个专业的项目文档参数提取助手。你的任务是从用户提供的相关文档中，提取结构化参数，并严格按照下面的\
            \ JSON Schema 输出。\n\n### 输入\n用户会粘贴或上传项目文档内容（可能是部分或全部）。你需要从中提取所有你能找到的参数，不要编造。\n\
            \n### 输出格式\n必须输出一个合法的 JSON 对象，结构如下（如果某个字段在文档中未出现，则填 null 或省略该字段）：\n{\n\
            \  \"project_basic_info\": {\n    \"project_name\": \"工程名称（字符串）\",\n \
            \   \"location\": \"建设地点（字符串）\",\n    \"total_building_area\": \"总建筑面积（数值+单位，如\
            \ 301354.26㎡）\",\n    \"land_area\": \"占地面积（数值+单位）\",\n    \"building_composition\"\
            : \"建筑组成简述（字符串或数组）\",\n    \"structure_type\": \"结构形式（字符串）\",\n    \"\
            floor_and_height\": \"层数与高度（字符串或对象）\",\n    \"total_duration_days\": \"\
            总工期（数字，单位天）\",\n    \"planned_start_date\": \"计划开工日期（字符串）\",\n    \"planned_end_date\"\
            : \"计划竣工日期（字符串）\",\n    \"quality_target\": \"质量目标（字符串）\",\n    \"safety_target\"\
            : \"安全目标（字符串）\",\n    \"geographic_environment\": \"地理环境描述（字符串）\",\n \
            \   \"climate_conditions\": \"气候条件（字符串）\"\n  },\n  \"technical_constraints\"\
            : {\n    \"excavation_support\": \"基坑支护工艺（字符串）\",\n    \"pile_foundation_tech\"\
            : \"桩基工艺（字符串）\",\n    \"special_techniques\": \"特殊工艺（数组或字符串）\",\n    \"\
            main_structure_tech\": \"主体结构工艺（字符串）\",\n    \"process_logic_sequence\"\
            : [\n        { \n          \"pre\": \"第n道工序（字符串）\", \n          \"post\"\
            : \"第n+1道工序（字符串）\", \n          \"relation\": \"活动依赖关系（字符串，合法值为'FS'或'FF'或'SS'或'SF'）\"\
            , \n          \"lag\": \"工序间时间（字符串，含单位）\" \n        }\n    ],\n    \"\
            construction_zones\": [\n        {\n          \"id\": \"分区名称（字符串）\", \n\
            \          \"relative_scale\": \"相对比例（数值，设总建设面积为1.0）\"\n        }\n  \
            \  ]\n  },\n  \"resource_constraints\": {\n    \"human_resources\": {\n\
            \      \"peak_labor_count\": \"总劳动力峰值（数字）\",\n      \"main_trades\": \"\
            主要工种及人数（数组，每项含工种和人数）\",\n      \"weekly_work_hours\": \"每周工时（字符串，含单位，默认30小时）\"\
            \n    },\n    \"material_resources\": [\n        {\n          \"material_name\"\
            : \"材料名称（字符串）\",\n          \"required_quantity\": \"需求量（字符串，含单位）\",\n\
            \          \"supply_lead_time\": \"供应期（字符串）\"\n        }\n    ],\n   \
            \ \"equipment\": [\n        {\n          \"equipment_name\": \"设备名称（字符串）\"\
            ,\n          \"quantity\": \"数量（字符串，含单位）\"\n        }\n    ],\n    \"\
            temporary_materials\": [\n        {\n          \"temporary_material_name\"\
            : \"临时材料名称（字符串）\",\n          \"required_quantity\": \"需求量（字符串，含单位）\"\n\
            \        }\n    ]\n  },\n  \"organization_and_management\": {\n    \"\
            general_contractor\": \"总承包单位（字符串）\",\n    \"project_manager\": \"项目负责人（字符串及资质）\"\
            ,\n    \"tech_lead\": \"技术负责人（字符串及职称）\",\n    \"funding_terms\": \"资金条件（字符串）\"\
            \n  },\n  \"external_constraints\": {\n    \"government_regulations\"\
            : {\n      \"night_work_restriction\": \"夜间施工规定（字符串）\",\n      \"muck_truck_time\"\
            : \"渣土运输时间（字符串）\",\n      \"exam_silence_periods\": \"考试管制（字符串）\",\n \
            \     \"environmental_limits\": \"环保要求（字符串）\"\n    },\n    \"mandatory_milestones\"\
            : [\n        {\n          \"name\": \"名称（字符串）\",\n          \"date\":\
            \ \"日期（字符串）\",\n          \"description\": \"描述（字符串）\",\n          \"\
            allow_delay\": \"是否允许延迟（布尔值）\"\n        }\n    ],\n    \"spatial_occupancy_rules\"\
            : [\n        {\n          \"occupied_zone_id\": \"被占用的分区名称（字符串）\",\n \
            \         \"occupier\": \"占用用途（字符串）\",\n          \"occupancy_period_trigger\"\
            : \"触发占用时间（字符串）\",\n          \"affected_zones\": \"影响分区名称（数组）\",\n  \
            \        \"constraint_type\": \"限制类型（字符串）\",\n          \"logic_impact\"\
