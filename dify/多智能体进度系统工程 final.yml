          def compute_resource_by_productivity(quantity, planned_days, resource_name,\
          \ task_name=\"\", original_unit=\"\"):\n    if quantity <= 0 or planned_days\
          \ <= 0:\n        return None\n\n    if quantity == 1 and original_unit in\
          \ [\"项\", \"个\"]:\n        return None\n\n    # ===== 核心修正：混凝土养护任务特殊处理 =====\n\
          \    if \"养护\" in task_name and resource_name == \"普工\":\n        return\
          \ {\"per_day\": 2, \"total_days\": planned_days * 2}\n\n    if resource_name\
          \ == \"塔吊\":\n        for keyword, prod in TOWER_CRANE_PRODUCTIVITY.items():\n\
          \            if keyword in task_name:\n                daily_required =\
          \ quantity / planned_days\n                required_count = math.ceil(daily_required\
          \ / prod)\n                if required_count < 1:\n                    required_count\
          \ = 1\n                total_days = required_count * planned_days\n    \
          \            return {\"per_day\": required_count, \"total_days\": round(total_days,\
          \ 2)}\n        productivity = 100\n    else:\n        productivity = PRODUCTIVITY.get(resource_name)\n\
          \        if not productivity or productivity <= 0:\n            return None\n\
          \n    daily_required = quantity / planned_days\n    required_count = math.ceil(daily_required\
          \ / productivity)\n    if required_count < 1:\n        required_count =\
          \ 1\n\n    total_days = required_count * planned_days\n    return {\"per_day\"\
          : required_count, \"total_days\": round(total_days, 2)}\n\n\ndef compute_resource_by_quota(quantity,\
          \ planned_days, resource_name, quota_dict):\n    per_unit = quota_dict.get(resource_name)\n\
          \    if not per_unit:\n        return None\n    total_resource_days = quantity\
          \ * per_unit\n    per_day = math.ceil(total_resource_days / planned_days)\
          \ if planned_days > 0 else 0\n    if per_day > 0:\n        return {\"per_day\"\
          : per_day, \"total_days\": round(total_resource_days, 2)}\n    return None\n\
