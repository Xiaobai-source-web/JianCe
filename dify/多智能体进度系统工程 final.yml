    - data:
        code: "\n\"\"\"\n节点名称：变量聚合器（CPM + 资源定额计算结果）\n输入变量：\n  - cpm_result (Object)：关键路径计算节点的输出\n\
          \  - resource_demand (Object)：资源定额计算节点的输出\n输出变量：\n  - aggregated_string\
          \ (String)：合并后的 JSON 字符串\n\"\"\"\n\nimport json\n\ndef main(cpm_result:\
          \ dict, resource_demand: dict) -> dict:\n    \"\"\"合并两个对象为一个 JSON 字符串\"\"\
          \"\n    # 确保输入为字典类型（Dify 传入的可能已经是 dict 或字符串）\n    cpm_data = cpm_result\
          \ if isinstance(cpm_result, dict) else {}\n    res_data = resource_demand\
          \ if isinstance(resource_demand, dict) else {}\n    \n    # 构建聚合对象\n   \
          \ aggregated = {\n        \"cpm\": cpm_data,\n        \"resource_demand\"\
          : res_data\n    }\n    \n    # 转为 JSON 字符串（紧凑格式，也可用 indent=2 格式化）\n    aggregated_string\
          \ = json.dumps(aggregated, ensure_ascii=False)\n    \n    return {\"aggregated_string\"\
          : aggregated_string}\n"
