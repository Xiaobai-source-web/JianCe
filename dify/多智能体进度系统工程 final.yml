          : planned_days\n                })\n                continue\n\n       \
          \     if quantity == 1 and unit == \"项\":\n                result_tasks.append({\n\
          \                    \"task_id\": task_id,\n                    \"task_name\"\
          : task_name,\n                    \"quantity\": quantity,\n            \
          \        \"planned_duration_days\": planned_days\n                })\n \
          \               continue\n\n            # ---- 核心匹配逻辑 ----\n           \
          \ matched_resources = []\n            work_type = None\n            matched_keyword\
          \ = None\n\n            sorted_mappings = sorted(RESOURCE_MAPPING.items(),\
          \ key=lambda x: len(x[0]), reverse=True)\n            for keyword, mapping\
          \ in sorted_mappings:\n                if keyword in task_name:\n      \
          \              matched_resources = mapping.get(\"resources\", [])\n    \
          \                work_type = mapping.get(\"work_type\", task_name)\n   \
          \                 matched_keyword = keyword\n                    break\n\
          \n            if not matched_resources:\n                wt = task.get(\"\
          work_type\", \"\")\n                if wt and wt in RESOURCE_MAPPING:\n\
          \                    mapping = RESOURCE_MAPPING[wt]\n                  \
          \  matched_resources = mapping.get(\"resources\", [])\n                \
          \    work_type = mapping.get(\"work_type\", wt)\n                    matched_keyword\
          \ = wt\n\n            if not matched_resources:\n                matched_resources\
          \ = [\"普工\"]\n                work_type = task_name\n                unmatched_tasks.append({\n\
          \                    \"task_id\": task_id,\n                    \"task_name\"\
          : task_name,\n                    \"work_type\": task.get(\"work_type\"\
          , \"\"),\n                    \"keyword\": \"无匹配\"\n                })\n\
          \n            demand = {\n                \"task_id\": task_id,\n      \
          \          \"task_name\": task_name,\n                \"quantity\": quantity,\n\
          \                \"planned_duration_days\": planned_days\n            }\n\
          \n            if matched_keyword:\n                demand[\"_matched_keyword\"\
          ] = matched_keyword\n\n            for resource_name in matched_resources:\n\
          \                result = compute_resource_by_productivity(quantity, planned_days,\
          \ resource_name, task_name, unit)\n\n                if result is None:\n\
          \                    result = compute_resource_by_quota(quantity, planned_days,\
          \ resource_name, FALLBACK_QUOTAS)\n\n                if result is None:\n\
          \                    if resource_name != \"普工\":\n                     \
          \   result = compute_resource_by_quota(quantity, planned_days, \"普工\", FALLBACK_QUOTAS)\n\
          \                        if result:\n                            demand[\"\
          普工_per_day\"] = result[\"per_day\"]\n                            demand[\"\
          普工_total_days\"] = result[\"total_days\"]\n                    continue\n\
          \n                demand[f\"{resource_name}_per_day\"] = result[\"per_day\"\
          ]\n                demand[f\"{resource_name}_total_days\"] = result[\"total_days\"\
          ]\n\n            if boundaries:\n                demand = apply_peak_shaving(demand,\
          \ boundaries)\n\n            result_tasks.append(demand)\n\n        result\
          \ = {\"resource_demand\": {\"tasks\": result_tasks}}\n\n        if unmatched_tasks:\n\
          \            result[\"resource_demand\"][\"_warnings\"] = {\n          \
          \      \"unmatched_tasks\": unmatched_tasks,\n                \"count\"\
          : len(unmatched_tasks),\n                \"message\": f\"有 {len(unmatched_tasks)}\
          \ 个任务未匹配到关键词，已使用普工作为兜底\"\n            }\n\n        return result\n\n   \
          \ except Exception as e:\n        return {\"resource_demand\": {\"tasks\"\
          : [], \"_error\": str(e)}}"
